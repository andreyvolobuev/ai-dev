# Шаблоны всех сообщений, которые бот пишет людям.
#
# Все формат-строки используют Python str.format. Список доступных
# placeholders приведён над каждым шаблоном.
# Условные секции (когда блок может быть пустым) делает рендер-код:
# в шаблон передаётся уже готовая строка (`_block`), пустая если
# секция не нужна.
#
# LLM-системные промпты (Analyst / Dev / ThreadResponder) — НЕ здесь,
# они в коде т.к. жёстко связаны с агентом.

# --- Mattermost ---
# Reviewer / DevOps пишут в `mappings.team_channels[<repo>]` или DM на
# `escalation.mattermost_user`. Все доступные placeholders:
# {repo_key}, {iid}, {title}, {web_url}, {idle_hours} (только в stale/escalation).
mattermost:
  # {summary} is a 1-2 sentence first-person feminine fragment from
  # the MrSummarizer ("добавила X, исправила Y"). Falls back to {title}
  # when no summarizer is wired. {key} — тикет (DM-1234).
  # {mentions} обязателен: голое «Ребята, …» в треде никто не замечает.
  # Это `@ник` ревьюеров репо (repositories.yaml → reviewers) без тех,
  # кто в отпуске/на больничном, или `@channel`, если список пуст.
  review_ping: |
    {mentions} Ребята, приглашаю на ревью [МР]({web_url}) по задаче {key}, в котором я {summary}

  # В тред обсуждения тикета, когда бот берётся за работу. Обычно аналитик
  # пишет свою фразу (thread_note в submit_plan) — это запасной текст.
  # Ссылку на МР бот принесёт в этот же тред (review_ping).
  plan_ready_in_thread: |
    Возражений нет — взялась за работу, МР принесу сюда.

  merge_ping: |
    Мой реквестик [{iid}]({web_url}) собрал апрувы. Смержите, пожалуйста 😊

  # {mentions} — как в review_ping.
  stale_ping: |
    {mentions} Ребят, мой [реквестик]({web_url}) ждёт ревью уже {idle_hours}ч 😔 Гляньте, пожалуйста 🙏

  escalation_dm: |
    Мой [МР]({web_url}) без активности уже {idle_hours}ч — напомни кому-нибудь или переназначь.

  # DevOps авто-фикс: ТОЛЬКО DM на escalation.mattermost_user, никогда не
  # в канал. Канал должен видеть MR только когда CI зелёный и можно ревью.
  # {repo_key}, {iid}, {title}, {web_url}, {attempts}, {failing_jobs}.
  pipeline_autofix_gave_up_dm: |
    Проблемка: CI на `{repo_key}!{iid}` не починился после {attempts} попыток авто-фикса.

    Title: {title}
    Failing jobs: {failing_jobs}
    URL: {web_url}

    Нужно вручную разобраться, что не так. Ответь `/restart` в этом треде, когда захочешь, чтобы я попробовала снова.

  # CI падает по инфраструктурным причинам (registry 5xx, таймауты
  # прокси, runner) — код ни при чём, бот сам перезапускал пайплайн и
  # НЕ тратил попытки авто-фикса. Текст обязан честно это отражать.
  # {repo_key}, {iid}, {title}, {web_url}, {retries}, {failing_jobs}.
  pipeline_infra_gave_up_dm: |
    CI на `{repo_key}!{iid}` падает по инфраструктурным причинам (registry/прокси/runner) — код тут ни при чём, править нечего. Я перезапускала пайплайн, попыток: {retries}, не помогло.

    Title: {title}
    Failing jobs: {failing_jobs}
    URL: {web_url}

    Посмотри, что с инфрой CI, или перезапусти пайплайн вручную попозже. Ответь `/restart` в этом треде, когда можно пробовать снова.

  # Подтверждение сброса авто-фикс счётчика по команде /restart от тимлида.
  pipeline_autofix_restart_ack: |
    Ок, сбросила счётчик попыток — пробую починить CI заново.

  # Reviewer thread responses (MmThreadListener). {commit_sha_short}, {branch}.
  thread_reply_no_dev_agent: "Не могу внести правку по этому репозиторию — нужна помощь человека."
  thread_reply_no_task: "Не нашла связанный тикет."
  thread_reply_iteration_crashed: "Попробовала внести правку, но упёрлась в проблему на своей стороне. Пните меня здесь ещё раз — попробую заново."
  # Постится в тред когда CI на iteration-коммите станет зелёным.
  # До этого момента бот молчит — нет смысла звать ревьюеров на код,
  # который ещё не подтверждён пайплайном.
  thread_reply_iteration_done: "✅ Внесла правки, CI зелёный — коммит `{commit_sha_short}` на `{branch}`. Можно смотреть 🙏"
  thread_reply_iteration_no_changes: "Посмотрела ещё раз — код уже соответствует замечанию, отдельный коммит не потребовался. Если я что-то упустила, напишите, что именно поправить."
  # Итерация обновила только заголовок/описание MR (через API, без
  # коммита) — это успех, а не "ничего не изменилось".
  thread_reply_iteration_metadata_only: "✅ Поправила описание/заголовок MR — правка кода тут не требовалась."

  # --- Lead-escalation DMs ---
  # The analyst agent composes the body of every per-recipient DM
  # itself, so we no longer template the clarifying questions. The two
  # templates below are for the *terminal* DMs the orchestrator sends
  # to the team-lead when the analyst gives up:
  #
  # * `stuck_escalation_to_lead` — analyst is stuck after multiple
  #   angles; ticket stays "In Progress".
  # * `blocked_escalation_to_lead` — analyst decided the ticket is
  #   blocked / unworkable; orchestrator has just transitioned it to
  #   "Waiting For Response" and posted an explanatory Jira comment.
  #
  # Одна-две строки, без цепочки шагов: её назвали нечитаемой простынёй,
  # весь след виден на дашборде. Placeholders: {tracker}, {external_id},
  # {task_url}, {original_question}, {reason} (уже человеческими словами).
  stuck_escalation_to_lead: |
    Застряла по [{external_id}]({task_url}): {reason}. Подскажи, как быть, или ответь в треде задачи — продолжу.

  blocked_escalation_to_lead: |
    Перевела [{external_id}]({task_url}) в Pending: {reason}. Дальше без твоего решения не пойду.

  # --- Интейк задач ---
  # Ответ на просьбу завести задачу. Факты — от раннера, не от модели.
  # Одна короткая строка: всё остальное видно в самом тикете.
  # Используются {key}, {url}, {warnings_block} («. Предупреждение.» или
  # пусто). Раннер по-прежнему передаёт и {summary}, {assignee}, {sprint}
  # (имя спринта или «без спринта») - старые копии файла с ними не падают.
  intake_created: |
    Завела [{key}]({url}){warnings_block}

  # {changes} — что именно поменяла.
  intake_updated: |
    Готово: {changes}

  # {reason} — короткая причина отказа Jira.
  intake_failed: |
    Не смогла завести задачу в Jira: {reason}. Повтори просьбу — попробую снова.

  # Фолбэк, если модель не написала свой текст отказа.
  intake_busy_fallback: |
    Сейчас занята задачей, отвлечься не могу.

  # Дописки к intake_created, когда что-то не доехало.
  intake_warning_sprint_not_found: "нужный спринт не нашла — положи задачу в спринт сама"
  intake_warning_sprint_failed: "в спринт положить не получилось"
  intake_warning_assignee_hint_unresolved: "не поняла, кого назначить, оставила без исполнителя"
  intake_warning_assignee_hint_unresolved_update: "не поняла, кого назначить, исполнителя оставила как был"

# --- Jira (комментарии к тикетам) ---
# Доступные placeholders:
#   {tracker}, {external_id}, {status}, {confidence}, {summary},
#   {iterations}, {target_repo_block}, {steps_block},
#   {open_questions_block}, {risks_block}, {dashboard_block},
#   {web_url}, {branch}, {branch_block}, {notes_block}.
jira:
  plan_comment: |
    *Написала план по задаче*

    *Статус:* {status}
    *Увереность в плане:* {confidence}
    {target_repo_block}
    *Суть*
    {summary}
    {steps_block}
    {open_questions_block}
    {risks_block}

    _Шаги: {iterations}._
    {dashboard_block}

  mr_link_comment: |
    *Открыла реквест по задаче*

    - MR: {web_url}
    - Ветка: `{branch}`

    _Приходите на ревью_

  failure_comment: |
    *К сожалению, не смогла завершить задачу.*
    {branch_block}
    {notes_block}

    _Тут надо разобраться человеку. Прошу прощения, что у меня не получилось._

  # Posted when the analyst calls `blocked` — we move the ticket to
  # "Waiting For Response" and explain why in this comment, then DM
  # the lead with `blocked_escalation_to_lead`.
  # Available placeholders: {external_id}, {task_url}, {reason}.
  blocked_comment: |
    *Кинула задачу в PENDING*

    **Причина:** {reason}

    Уведомила тимлида и больше не работаю над тикетом до дальнейших указаний.

# --- GitLab MR (то, что бот сам пишет в title / description / commit) ---
# {key} — ticket external id, {title} — модель-сабмит, {url} — ticket URL,
# {description} — модель-сабмит, {plan_block}, {notes_block}.
merge_request:
  title: "[{key}] {title}"
  commit_message: "[{key}] {title}"
  description: |
    **Задача:** [{key}]({url})

    {description}
    {plan_block}
    {notes_block}
